# Windows 95 Linux OTA 更新源配置
# 修改后无需重启，下次“检查更新/下载”时生效。
#
# 自定义更新清单地址（默认使用内置 GitHub 地址）：
# MANIFEST_URL=https://example.com/win95/latest.json
#
# 内置镜像: gh-proxy.com、ghfast.top、ghproxy.net、ghproxy.cn
# 下载加速镜像，可写多行；镜像地址会拼在原始 GitHub 链接前面：
# MIRROR=https://gh-proxy.com/
# MIRROR=https://ghfast.top/
# 也支持模板（{url} 会被替换成原始链接）：
# MIRROR=https://example.com/fetch?url={url}
#
# 写 MIRROR 行会替换内置镜像列表；不写则使用内置列表。
# 国内网络可关闭 GitHub 直连，减少等待：
# DIRECT=0
