; Windows 95 Linux registry
; This file is read at startup and can be edited in Registry Editor.
; BackgroundColor: #RRGGBB, leave empty to use the BackgroundStyle wallpaper.
; BackgroundStyle: 0..N, see Display Properties for the list.
; Theme: palette index. Language: see Settings > Language.
; Font.Weight: normal or bold (the font family is the built-in Unifont).

[Desktop]
BackgroundColor=#008080
BackgroundStyle=1

[Font]
Family=Unifont
Weight=normal
Size=16

[Appearance]
Theme=0

[Locale]
Language=zh-CN
